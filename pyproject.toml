[project]
name = "gmail-client-assignment"
version = "0.1.0"
description = "A Gmail client implementation using interface-based design"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
	"pytest>=8.3.5",
	"pytest-cov",
	"ruff",
	"mypy",
	"requests",
	"python-dotenv",
	"google-generativeai",
	"google-api-python-client>=2.113.0",
	"google-auth>=2.28.1",
	"google-auth-oauthlib>=1.2.2",
	"google-auth-httplib2>=0.1.1",
	"oauth2client>=4.1.3",
	"html2text>=2023.0.0",
]

[tool.ruff]
line-length = 100
exclude = ["tests/snapshots"]

[tool.mypy]
strict = true
files = ["gmail_client", "tests"]
ignore_missing_imports = true
show_error_codes = true

[dependency-groups]
dev = ["types-requests>=2.32.0.20250328"]

[tool.setuptools]
packages = ["gmail_client"]

[tool.pytest.ini_options]
pythonpath = ["."]
